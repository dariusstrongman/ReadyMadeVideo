<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Stromation</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="theme-color" content="#08090b">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
<link rel="dns-prefetch" href="https://n8n.stromation.com">
<style>
  :root{--ink:#08090b;--fg:#e9eef2;--fg-dim:#8b97a1;--fg-faint:#727d8a;--cyan:#00E5FF;--line:rgba(233,238,242,0.12);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;--mono:"Courier New",ui-monospace,Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--fg);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--cyan);color:var(--ink)}a{color:inherit;text-decoration:none}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60vw 40vw at 50% -10%,rgba(0,229,255,0.10),transparent 60%)}
  .box{position:relative;max-width:440px}
  .code{font-family:var(--mono);font-size:0.72rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--cyan)}
  h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-0.03em;margin:16px 0 0}
  h1 .p{color:var(--cyan)}
  p{color:var(--fg-dim);margin:16px auto 0;max-width:34ch;font-size:1rem}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  .btn{background:var(--cyan);color:var(--ink);font-weight:700;font-size:0.9rem;padding:13px 22px;border-radius:9px}
  .btn:hover{box-shadow:0 8px 24px rgba(0,229,255,0.3)}
  .ghost{border:1px solid var(--line);color:var(--fg-dim);padding:13px 22px;border-radius:9px;font-family:var(--mono);font-size:0.8rem}
  .ghost:hover{color:var(--cyan);border-color:var(--cyan)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="box">
  <div class="code">404 · not found</div>
  <h1>This page doesn't run here<span class="p">.</span></h1>
  <p>The page moved or never existed. Your busywork, though — that we can automate.</p>
  <div class="row">
    <a class="btn" href="starter-pack.html#get">Get the free Starter Pack →</a>
    <a class="ghost" href="templates.html">the library</a>
    <a class="ghost" href="/">back home</a>
  </div>
</div>
</body>
</html>

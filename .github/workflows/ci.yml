name: CI

on:
  pull_request:
  push:
    branches: [feature/real-video-pipeline, codex/human-ceiling-evaluation,
               codex/full-audiovisual-editor-v1,
               codex/audiovisual-milestone-2-picture-editor,
               codex/audiovisual-milestone-3-music-sound,
               codex/audiovisual-milestone-4-audio-rendering,
               codex/audiovisual-milestone-5-motion-graphics,
               codex/audiovisual-milestone-6-editorial-intelligence,
               codex/audio-asset-library-ingestion,
               codex/audio-library-pipeline-integration,
               codex/product-editor-phase-1,
               repair/audit-fixes]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Product Editor frontend tests
        run: npm test
      - name: Frontend secret guard (no service keys in source or bundle)
        run: node scripts/check-secrets.mjs
      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high
      - name: License report (frontend)
        run: npx license-checker --summary --production > ../frontend-licenses.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: frontend-licenses, path: frontend-licenses.txt }

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: render-backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - name: System deps (real ffmpeg + fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python deps
        run: pip install -r requirements.txt pip-licenses pip-audit
      - name: Static analysis (ruff)
        run: ruff check app/ --output-format=github
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --strict || pip-audit -r requirements.txt
      - name: Unit + worker + operator-API + fixture-render tests (real FFmpeg)
        run: python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=json:coverage.json --cov-report=term --junitxml=test-report.xml
      - name: Critical-module coverage gate
        run: python ../scripts/check_coverage.py coverage.json
      - name: Render CI artifact videos (preview + final)
        run: python ../scripts/ci_render_artifact.py
        env: { CI_ARTIFACT_DIR: ci-artifacts }
      - name: License report (python)
        run: pip-licenses --format=markdown > python-licenses.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-artifacts
          path: |
            render-backend/test-report.xml
            render-backend/coverage.xml
            render-backend/ci-artifacts/*.mp4
            render-backend/python-licenses.md

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate migrations against real Postgres
        env: { PGPASSWORD: ci }
        run: |
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/bootstrap.sql
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "all migrations applied cleanly"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260801_0012_audiovisual_motion_graphics.sql
          echo "migration 0012 reapplied cleanly (idempotency check)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260801_0013_audiovisual_editorial_intelligence.sql
          echo "migration 0013 reapplied cleanly (idempotency check)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260802_0014_product_editor_phase1.sql
          echo "migration 0014 reapplied cleanly (idempotency check)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260803_0016_bridged_candidate_origin.sql
          echo "migration 0016 reapplied cleanly (restores bridge trigger after the 0013 reapply)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260803_0019_soft_delete_child_rls.sql
          echo "migration 0019 reapplied cleanly (restores child-table not-deleted RLS after the 0013/0014 reapplies)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f supabase/migrations/20260803_0021_soft_delete_child_rls_complete.sql
          echo "migration 0021 reapplied cleanly (restores remaining child-table not-deleted RLS after the 0012 reapply)"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/human_ceiling_integrity.sql
          echo "human-ceiling PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/picture_editor_integrity.sql
          echo "picture-editor PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/music_sound_integrity.sql
          echo "music-sound PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/audio_rendering_integrity.sql
          echo "audio-rendering PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/visual_finishing_integrity.sql
          echo "visual-finishing PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/editorial_intelligence_integrity.sql
          echo "editorial-intelligence PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/bridged_candidate_integrity.sql
          echo "bridged-candidate PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/project_deletion_integrity.sql
          echo "project-deletion-state PostgreSQL integrity assertions passed"
          psql -h localhost -U postgres -d ci -v ON_ERROR_STOP=1 -f .github/ci/soft_delete_child_integrity.sql
          echo "soft-deleted-child RLS + render_jobs insert-denial PostgreSQL integrity assertions passed"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
